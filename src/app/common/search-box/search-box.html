<form role="search" (submit)="onSubmit($event)">
      <label for="search-input">{{ label() }}</label>
      <input
        id="search-input"
        type="search"
        [placeholder]="placeholder()"
        [value]="text()"
        (input)="onInput($event)" />
      <button type="submit" [disabled]="!text().trim()">Search</button>
    </form>
